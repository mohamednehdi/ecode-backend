# Nginx in front of the application containers: one public entry point, load balancing, request size limit.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;                       # the application logs every request itself (gunicorn access log)
    client_max_body_size 11m;             # a little above MAX_UPLOAD_MB (10): Flask then answers with its JSON 413
    client_body_buffer_size 1m;

    # Docker's internal DNS returns the address of every `app` container; with a variable in proxy_pass
    # Nginx re-resolves the name every few seconds, so containers added with --scale are used at once.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location = /nginx-health {
            return 200 'ok';
        }

        location / {
            set $backend http://app:5000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append to) the header: a client cannot forge its own address. The application
            # trusts exactly one proxy hop (TRUSTED_PROXIES=1) and reads the client address from here.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_next_upstream error;     # try another container only if one cannot be reached
        }
    }
}
